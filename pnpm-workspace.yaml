packages:
  - apps/*
  - packages/*
  - services/*
  - firebase
  - functions
allowBuilds:
  esbuild: true
  '@firebase/util': false
  protobufjs: false
  # Optional native speed-up for BullMQ's msgpack; the JS fallback is fine.
  msgpackr-extract: false
  # Optional native regex for superstatic (firebase-tools); it falls back to JS RegExp.
  re2: false
